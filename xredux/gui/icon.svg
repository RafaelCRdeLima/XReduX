<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-label="XREDUX">
  <!-- O ícone é o perfil de pulso dobrado: é o produto que identifica o
       programa, e a forma de dois picos por rotação é reconhecível já em 48 px.
       As cores são as mesmas da interface. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a3d"/>
      <stop offset="1" stop-color="#101724"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#ground)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none"
        stroke="#33415c" stroke-width="1"/>

  <!-- Linha da taxa média, como no gráfico do programa -->
  <line x1="36" y1="150" x2="220" y2="150" stroke="#5b6b82" stroke-width="4"
        stroke-dasharray="3 11" stroke-linecap="round"/>

  <!-- Perfil de dois picos, com o segundo mais estreito -->
  <path d="M36 168
           C 52 168, 58 96, 80 96
           C 100 96, 104 176, 126 178
           C 142 179, 148 74, 168 74
           C 188 74, 192 170, 220 170"
        fill="none" stroke="#4f8cff" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fóton que chega: o ponto brilhante no pico -->
  <circle cx="168" cy="74" r="15" fill="#eaf1ff"/>
  <circle cx="168" cy="74" r="26" fill="none" stroke="#8ab4ff" stroke-width="4"
          opacity="0.45"/>
</svg>
